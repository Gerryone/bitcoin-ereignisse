# 25.08.2026 16:45
# Ersetzt bitcoin-update.yml und claude-einschaetzung.yml.
# Drei Jobs laufen sequenziell: Haiku → Sonnet → HA-Sync.
# Sonnet startet erst wenn Haiku erfolgreich abgeschlossen ist,
# HA-Sync erst wenn Sonnet erfolgreich abgeschlossen ist.
# Kein Timing-Problem mehr möglich.

name: Bitcoin Pipeline

on:
  schedule:
    # Haiku startet täglich um 22:00 UTC (nach US-Börsenschluss 21:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:

  # ─── Job 1: Haiku ────────────────────────────────────────────
  haiku_update:
    name: Bitcoin Ereignisse Update (Haiku)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install anthropic requests

      - name: Bitcoin-Ereignisse aktualisieren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_bitcoin.py

      - name: Änderungen committen und pushen
        run: |
          git config user.name "Bitcoin-Ereignisse-Bot"
          git config user.email "bitcoin-ereignisse-bot@github.com"
          git add ereignisse.json edelmetalle.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen – nichts zu committen."
          else
            git commit -m "Update: Bitcoin-Ereignisse + Edelmetalle $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "✓ Erfolgreich gepusht."
          fi

  # ─── Job 2: Sonnet ───────────────────────────────────────────
  sonnet_einschaetzung:
    name: Claude Sonnet Bitcoin-Einschätzung
    runs-on: ubuntu-latest
    needs: haiku_update
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install anthropic requests

      - name: Claude (Sonnet) Einschätzung erstellen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/claude_einschaetzung.py

      # Ohne diesen Schritt geht die Fehlerdatei verloren: sie wird zwar
      # geschrieben, aber der Commit-Schritt laeuft nach einem Absturz nicht
      # mehr. Uebrig blieb bisher nur der Traceback im Log.
      - name: Fehlerprotokoll als Artefakt sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: claude-fazit-error-debug
          path: claude_fazit_error_debug.json
          if-no-files-found: warn
          retention-days: 14

      - name: Änderungen committen und pushen
        run: |
          git config user.name "Claude-Einschaetzung-Bot"
          git config user.email "claude-einschaetzung-bot@github.com"
          git add claude_fazit.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen – nichts zu committen."
          else
            git commit -m "Update: Claude-Einschätzung $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "✓ Erfolgreich gepusht."
          fi

  # ─── Job 3: HA-Sync ──────────────────────────────────────────
  ha_sync:
    name: Home Assistant Sync
    runs-on: ubuntu-latest
    needs: sonnet_einschaetzung
    steps:
      # 25.08.2026 16:45 - Ziel von ha.renken2019.de auf gerry07.duckdns.org
      # umgestellt. Der alte Name wurde vom Reverse Proxy der Synology-NAS
      # bedient und per CNAME auf die MyFRITZ-Adresse gefuehrt. Die NAS ist
      # abgeschaltet; seitdem beantwortet der NGINX des Home Assistant die
      # Anfrage mit seinem Zertifikat fuer gerry07.duckdns.org, das nicht zum
      # angefragten Namen passt - curl bricht im TLS-Handshake ab (Exitcode 35,
      # in der Nacht davor Exitcode 28). Der DuckDNS-Name haengt an keinem NAS.
      - name: GitHub-Sync in Home Assistant auslösen
        run: |
          # "|| CURL_EXIT=$?" ist noetig, weil GitHub Actions das Skript mit
          # "bash -e" startet: ohne das bricht die Shell schon bei der Zuweisung
          # mit dem curl-Exitcode ab und die Ausgaben darunter laufen nie. Genau
          # deshalb stand in den Logs vom 23. bis 25.08. nur eine nackte
          # Exit-Nummer und keine Erklaerung.
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 --max-time 60 \
            -X POST \
            "https://gerry07.duckdns.org/api/webhook/bitcoin_github_sync_webhook") \
            || CURL_EXIT=$?
          CURL_EXIT=${CURL_EXIT:-0}
          echo "curl-Exitcode: $CURL_EXIT"
          echo "HTTP Status:   $HTTP_STATUS"
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "Fehler: curl konnte den Webhook nicht aufrufen (Exitcode $CURL_EXIT)."
            echo "  6 = DNS, 7 = keine Verbindung, 28 = Zeitueberschreitung,"
            echo "  35 = TLS-Handshake, 60 = Zertifikat nicht ueberpruefbar."
            exit 1
          fi
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "204" ]; then
            echo "Fehler: HA-Webhook antwortete mit Status $HTTP_STATUS"
            exit 1
          fi
          # Achtung: Home Assistant antwortet auch auf einen UNBEKANNTEN
          # webhook_id mit 200. Ein gruener Schritt beweist nur, dass HA
          # erreichbar war - nicht, dass die Automation gelaufen ist. Das
          # zeigt nur last_triggered der Automation in HA.
          echo "✓ HA-Sync erfolgreich ausgelöst."
